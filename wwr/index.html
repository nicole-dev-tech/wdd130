    <meta name="description"
      content="Experience thrilling white water rafting adventures with expert guides. Book your trip today.">

<body>

    <header class="site-header">
        <img src="images/rapid-logo.jpg" alt="Rafting company 
                logo">
        <nav class="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
